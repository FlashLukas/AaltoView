    <rect x="18" y="8"  width="6" height="6" opacity="0.7"/>
    <rect x="25" y="8"  width="6" height="6" opacity="1"/>
    <rect x="11" y="15" width="6" height="6" opacity="0.7"/>
    <rect x="18" y="15" width="6" height="6" opacity="1"/>
    <rect x="25" y="15" width="6" height="6" opacity="0.55"/>
    <rect x="11" y="22" width="6" height="6" opacity="1"/>
    <rect x="18" y="22" width="6" height="6" opacity="0.5"/>
    <rect x="25" y="22" width="6" height="6" opacity="0.25"/>
  </g>
  <rect x="17.3" y="14.3" width="7.4" height="7.4" fill="none"
        stroke="#5a626e" stroke-width="1.6"/>
